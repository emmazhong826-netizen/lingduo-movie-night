    <h2>Ling Duo 是谁</h2>

    <p class="page-text">
      Ling Duo 是一个关注教育、思考与真实交流的教育团队。
      <br><br>

      我们相信，教育不只是帮助一个人找到正确答案，
      也应该让一个人逐渐学会面对那些没有标准答案的问题。
      <br><br>

      如何阅读一个复杂的世界？
      <br>
      如何形成自己的判断？
      <br>
      如何表达自己的立场？
      <br>
      又如何认真听见一个与自己不同的人？
      <br><br>

      Ling Duo Movie Night 是我们把这种对话带出课堂的一种尝试。
    </p>
