<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>联系我们｜Ling Duo Night</title>

  <link rel="stylesheet" href="./style.css">
</head>


<body>

  <main class="page contact-page">

    <!-- BACK -->
    <a href="./index.html" class="back">
      ← 返回首页
    </a>


    <!-- LABEL -->
    <div class="page-label">
      CONTACT
    </div>


    <!-- TITLE -->
    <h2>
      联系我们
    </h2>


    <!-- CONTACT CHANNELS -->
    <div class="contact-channels contact-channels-simple">

      <!-- WECHAT -->
      <div class="contact-channel">

        <span class="contact-label">
          WECHAT
        </span>

        <button
          class="contact-link"
          onclick="openQR('wechatModal')"
        >
          Zhong_manlin ↗
        </button>

      </div>


      <!-- WECHAT OFFICIAL ACCOUNT -->
      <div class="contact-channel">

        <span class="contact-label">
          WECHAT OFFICIAL ACCOUNT
        </span>

        <a
          class="contact-link"
          href="https://mp.weixin.qq.com/s/QZ3wKbwrOh4x5nTa450ERQ"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ling Duo 聚焦 ↗
        </a>

      </div>

    </div>


    <!-- CLOSING -->
    <div class="contact-closing">

      <span>
        LING DUO NIGHT
      </span>

      <p>
        从影片出发，谈生活里真正重要的问题。
      </p>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>

    <span>
      Ling Duo Night
    </span>

    <span>
      Dongguan · Houjie
    </span>

  </footer>



  <!-- =========================================
       WECHAT QR MODAL
  ========================================== -->

  <div
    class="qr-modal"
    id="wechatModal"
    onclick="closeQR(event, 'wechatModal')"
  >

    <div class="qr-box">

      <!-- CLOSE -->
      <button
        class="qr-close"
        onclick="closeQRButton('wechatModal')"
        aria-label="关闭二维码"
      >
        ×
      </button>


      <!-- LABEL -->
      <span class="qr-label">
        WECHAT
      </span>


      <!-- NAME -->
      <h3>
        Zhong_manlin
      </h3>


      <!-- QR CODE -->
      <img
        src="./images/wechat-emma.jpg"
        alt="Zhong_manlin 微信二维码"
      >


      <!-- NOTE -->
      <p>
        打开微信扫一扫
      </p>

    </div>

  </div>



  <!-- =========================================
       SCRIPT
  ========================================== -->

  <script>

    function openQR(id) {
      document.getElementById(id).classList.add("active");
      document.body.classList.add("modal-open");
    }


    function closeQR(event, id) {

      if (event.target.id === id) {

        document.getElementById(id).classList.remove("active");
        document.body.classList.remove("modal-open");

      }

    }


    function closeQRButton(id) {

      document.getElementById(id).classList.remove("active");
      document.body.classList.remove("modal-open");

    }


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        document.querySelectorAll(".qr-modal").forEach(function(modal) {
          modal.classList.remove("active");
        });

        document.body.classList.remove("modal-open");

      }

    });

  </script>


</body>

</html>
